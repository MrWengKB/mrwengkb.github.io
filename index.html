<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pages 导航</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --title: #f0f6fc;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --meta: #8b949e;
      --tag-bg: #21262d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2.5rem 1.5rem;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      color: var(--title);
      font-size: 1.8rem;
      font-weight: 600;
    }

    .status-text {
      color: var(--meta);
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--title);
      margin-bottom: 0.5rem;
      word-break: break-word;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--meta);
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.8rem;
      color: var(--meta);
      flex-wrap: wrap;
    }

    .pill {
      background-color: var(--tag-bg);
      border: 1px solid var(--border);
      padding: 0.15rem 0.5rem;
      border-radius: 12px;
    }

    .card-links {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn-primary {
      background-color: #238636;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #2ea043;
    }

    .btn-secondary {
      background-color: var(--tag-bg);
      color: var(--title);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: var(--border);
    }

    .state-message {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--meta);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1 id="page-title">项目目录</h1>
      </div>
      <div id="repo-count" class="status-text">正在查询仓库...</div>
    </header>

    <div id="pages-container" class="grid">
      <div class="state-message">正在从 GitHub 获取项目列表...</div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 将此处换成您自己的 GitHub 账号用户名
    // ==========================================
    const GITHUB_USERNAME = "MrWengKB"; 

    // 是否隐藏当前的主页仓库（username.github.io）本身
    const EXCLUDE_HOME_REPO = true;

    const container = document.getElementById("pages-container");
    const countText = document.getElementById("repo-count");
    document.getElementById("page-title").textContent = `${GITHUB_USERNAME} 的 GitHub Pages`;

    async function fetchPagesRepos() {
      try {
        // 请求该用户公开仓库列表（默认按最近更新时间排序，单页拉取最多100个）
        const res = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=100`);
        
        if (!res.ok) {
          throw new Error(`API 访问失败: HTTP ${res.status}`);
        }

        const repos = await res.json();

        // 筛选出开启了 GitHub Pages 的公开仓库
        const pagesRepos = repos.filter(repo => {
          if (!repo.has_pages) return false;
          if (EXCLUDE_HOME_REPO && repo.name.toLowerCase() === `${GITHUB_USERNAME.toLowerCase()}.github.io`) {
            return false;
          }
          return true;
        });

        renderList(pagesRepos);
      } catch (err) {
        container.innerHTML = `<div class="state-message" style="color: #f85149;">加载失败: ${err.message}</div>`;
        countText.textContent = "获取失败";
      }
    }

    function renderList(repos) {
      if (repos.length === 0) {
        container.innerHTML = `<div class="state-message">未发现开启了 Pages 的其他公开仓库。</div>`;
        countText.textContent = "共 0 个站点";
        return;
      }

      countText.textContent = `共找到 ${repos.length} 个站点`;
      container.innerHTML = "";

      repos.forEach(repo => {
        // 项目仓库的 GitHub Pages 规范地址格式：https://<username>.github.io/<repo-name>/
        const pageUrl = `https://${GITHUB_USERNAME}.github.io/${repo.name}/`;
        const updatedDate = new Date(repo.updated_at).toLocaleDateString("zh-CN");

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div>
            <div class="card-title">${escapeHTML(repo.name)}</div>
            <div class="card-desc">${escapeHTML(repo.description || "暂无描述信息")}</div>
          </div>
          <div>
            <div class="card-meta">
              ${repo.language ? `<span class="pill">${escapeHTML(repo.language)}</span>` : ""}
              <span>更新于: ${updatedDate}</span>
              ${repo.stargazers_count > 0 ? `<span>★ ${repo.stargazers_count}</span>` : ""}
            </div>
            <div class="card-links">
              <a href="${pageUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">访问站点</a>
              <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">源码仓库</a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 防 XSS 转义函数
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    fetchPagesRepos();
  </script>
</body>
</html>
